<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H5 Games Arcade — SANKOFA : GARDIENS DE L'EMPIRE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #241934 0%, #0d0b14 75%);
      color: #f8f3e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .portal {
      max-width: 540px;
      width: 100%;
      background: rgba(24, 20, 38, 0.92);
      border: 2px solid #ffd24c;
      border-radius: 18px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 35px rgba(255, 180, 30, 0.18);
    }
    .badge {
      display: inline-block;
      background: rgba(255, 136, 0, 0.2);
      border: 1px solid #ff9922;
      color: #ffcc44;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 28px;
      color: #ffd75e;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(255, 160, 0, 0.35);
    }
    .sub {
      color: #b9b2c8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .heroes {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 26px;
    }
    .heroes img {
      width: 84px;
      height: 84px;
      object-fit: contain;
      background: radial-gradient(circle, rgba(255,180,40,0.22) 0%, rgba(0,0,0,0) 70%);
      border-radius: 12px;
      border: 1px solid rgba(255, 210, 76, 0.3);
      padding: 4px;
    }
    .play-btn {
      display: inline-block;
      width: 100%;
      padding: 15px 24px;
      background: linear-gradient(135deg, #ff8800 0%, #e04800 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      border-radius: 12px;
      border: 2px solid #ffe07d;
      box-shadow: 0 8px 24px rgba(255, 110, 0, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 140, 0, 0.55);
    }
  </style>
</head>
<body>
  <div class="portal">
    <div class="badge">AFROFUTURIST ACTION ROGUELITE</div>
    <h1>SANKOFA : GARDIENS DE L'EMPIRE</h1>
    <p class="sub">Incarnez 6 Gardiens légendaires d’Afrique de l’Ouest, maniez les Armes Sacrées et repoussez les hordes mystiques !</p>
    <div class="heroes">
      <img src="./sankofa/assets/artwork/charmander.png" alt="Soundjata" />
      <img src="./sankofa/assets/artwork/squirtle.png" alt="Nawi Agojie" />
      <img src="./sankofa/assets/artwork/bulbasaur.png" alt="Baka Ngonda" />
    </div>
    <a class="play-btn" href="./sankofa/">LANCER LA CHASSE ▶</a>
  </div>
</body>
</html>
